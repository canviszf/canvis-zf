
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Canvis Zona Franca</title>

  <!-- Icona personalitzada -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="apple-mobile-web-app-title" content="Canvis ZF">
  <meta name="theme-color" content="#9d171b">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #7f1016, #c5282d);
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      color: white;
      text-align: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 380px;
    }

    .logo {
      width: 180px;
      height: 180px;
      border-radius: 36px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
      margin-bottom: 28px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 10px;
      font-weight: 800;
    }

    p {
      font-size: 16px;
      color: #ffe0e0;
      margin: 0 0 36px;
    }

    .button {
      display: block;
      background: white;
      color: #9d171b;
      text-decoration: none;
      padding: 18px 24px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 36px;
      font-size: 12px;
      color: #ffd0d0;
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="./icon-180.png"
      alt="Canvis Zona Franca"
      class="logo"
    >

    <h1>Canvis Zona Franca</h1>

    <p>Sol·licituds de canvis de guàrdia</p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbzKCHTEvZvlTcRsFbNlGmfq8HSyfaYa3Ytp5bcJYBe9ZZ7_BPWyBDFSgRPTdP72IMmO/exec"
    >
      🚒 Entrar a l'aplicació
    </a>

    <div class="footer">
      Bombers de Barcelona · Zona Franca
    </div>

  </main>

</body>
</html>
