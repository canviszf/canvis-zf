
<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Canvis Zona Franca</title>

  <!-- Icona personalitzada -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="apple-mobile-web-app-title" content="Canvis ZF">
  <meta name="theme-color" content="#080000">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      background-color: #080000;
      background-image: url("./portada-canvis-zf.png");
      background-position: center bottom;
      background-repeat: no-repeat;
      background-size: cover;

      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      color: white;
      text-align: center;

      padding: clamp(55px, 12vh, 125px) 24px 220px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 180px;
      height: 180px;
      border-radius: 28%;
      object-fit: cover;
      display: block;
      margin: 0 auto 28px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 38px);
      margin: 0 0 14px;
      font-weight: 800;
      line-height: 1.15;
      text-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }

    .linea {
      width: 65px;
      height: 5px;
      background: #ff2028;
      border-radius: 10px;
      margin: 20px auto;
    }

    p {
      font-size: 17px;
      color: #ffe0e0;
      margin: 0 0 40px;
      line-height: 1.5;
    }

    .button {
      display: block;
      background: white;
      color: #9d171b;
      text-decoration: none;
      padding: 19px 20px;
      border-radius: 17px;
      font-size: 19px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .button:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      body {
        padding-top: 65px;
        padding-bottom: 230px;
        background-position: center bottom;
      }

      .logo {
        width: 145px;
        height: 145px;
        margin-bottom: 24px;
      }

      p {
        font-size: 15px;
        margin-bottom: 32px;
      }

      .button {
        font-size: 17px;
        padding: 17px 14px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <img
      src="./icon-180.png"
      alt="Canvis Zona Franca"
      class="logo"
    >

    <h1>Canvis Zona Franca</h1>

    <div class="linea"></div>

    <p>Sol·licituds de canvis de guàrdia</p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbzKCHTEvZvlTcRsFbNlGmfq8HSyfaYa3Ytp5bcJYBe9ZZ7_BPWyBDFSgRPTdP72IMmO/exec"
    >
      🚒 Entrar a l'aplicació
    </a>

  </main>

</body>
</html>
